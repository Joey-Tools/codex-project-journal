name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run tests
        run: python3 -m unittest discover -s tests
      - name: Verify fatal signal integration opt-in
        env:
          PROJECT_JOURNAL_RUN_FATAL_SIGNAL_TESTS: ${{ vars.PROJECT_JOURNAL_RUN_FATAL_SIGNAL_TESTS }}
        run: |
          if [ "$PROJECT_JOURNAL_RUN_FATAL_SIGNAL_TESTS" != "1" ]; then
            echo "PROJECT_JOURNAL_RUN_FATAL_SIGNAL_TESTS must be exactly 1" >&2
            exit 1
          fi
      - name: Run fatal SIGQUIT integration test
        env:
          PROJECT_JOURNAL_RUN_FATAL_SIGNAL_TESTS: ${{ vars.PROJECT_JOURNAL_RUN_FATAL_SIGNAL_TESTS }}
        run: >-
          python3 -m unittest -v
          tests.test_project_journal.ProjectJournalTests.test_helper_defers_sigquit_until_git_group_cleanup_fatal_integration
